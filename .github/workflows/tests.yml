name: Windows checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify setup
        shell: pwsh
        run: ./scripts/setup.ps1 -Python (Get-Command python).Source
      - name: Test CLI and MCP
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -m pytest -q --junitxml=local/test-results.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$results = Get-Content local/test-results.xml -Raw
          $skipped = ($results.testsuites.testsuite | Measure-Object -Property skipped -Sum).Sum
          if ($skipped -gt 0) { throw "CI requires zero skipped tests; observed $skipped." }
